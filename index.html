<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      id="app-favicon"
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Arxatec Academy</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem(
            "arxatec_academy.theme_mode",
          );
          var mode =
            stored === "light" || stored === "dark" ? stored : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var favicon = document.querySelector("#app-favicon");
          if (favicon)
            favicon.href = dark ? "/favicon_dark.svg" : "/favicon_light.svg";
        } catch (error) {
          void error;
        }
      })();
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }
      #app-splash .splash-mark {
        position: relative;
        width: 32px;
        height: 32px;
      }
      #app-splash .splash-base {
        opacity: 0.3;
      }
      #app-splash .splash-shimmer {
        position: absolute;
        inset: 0;
        -webkit-mask-image: linear-gradient(
          135deg,
          transparent 35%,
          black 50%,
          transparent 65%
        );
        mask-image: linear-gradient(
          135deg,
          transparent 35%,
          black 50%,
          transparent 65%
        );
        -webkit-mask-size: 250% 250%;
        mask-size: 250% 250%;
        animation: app-splash-shimmer 2.4s ease-in-out infinite;
      }
      @keyframes app-splash-shimmer {
        from {
          -webkit-mask-position: 100% 100%;
          mask-position: 100% 100%;
        }
        to {
          -webkit-mask-position: 0 0;
          mask-position: 0 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-shimmer {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" role="status" aria-label="Cargando" aria-busy="true">
        <div class="splash-mark" aria-hidden="true">
          <svg
            class="splash-base"
            width="32"
            height="32"
            viewBox="0 0 535 500"
            fill="none"

          <div class="splash-shimmer">
            <svg
              width="32"
              height="32"

    </div>

</html>
